<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Casse-Croûte du Hangar">
  <style>
    .fumee { animation: monte 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .f2 { animation-delay: -1.1s; } .f3 { animation-delay: -2.2s; }
    @keyframes monte { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-1.5px); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .fumee { animation: none; } }
  </style>
  <!-- Fumée : trait crème avec contour charbon, lisible sur le jaune comme sur le foncé -->
  <g fill="none" stroke-linecap="round">
    <g class="fumee">
      <path d="M22 13c-3-3 3-5 0-8.5" stroke="#1A1613" stroke-width="4.5"/>
      <path d="M22 13c-3-3 3-5 0-8.5" stroke="#FFF8EE" stroke-width="2"/>
    </g>
    <g class="fumee f2">
      <path d="M32 11c-3.5-3.5 3.5-5.5 0-9.5" stroke="#1A1613" stroke-width="4.5"/>
      <path d="M32 11c-3.5-3.5 3.5-5.5 0-9.5" stroke="#FFF8EE" stroke-width="2"/>
    </g>
    <g class="fumee f3">
      <path d="M42 13c-3-3 3-5 0-8.5" stroke="#1A1613" stroke-width="4.5"/>
      <path d="M42 13c-3-3 3-5 0-8.5" stroke="#FFF8EE" stroke-width="2"/>
    </g>
  </g>
  <!-- Cornet de frites (même dessin, réduit pour laisser la place à la fumée) -->
  <g transform="translate(5.8 14.4) scale(.82)" stroke="#1A1613" stroke-width="2.8" stroke-linejoin="round">
    <rect x="17" y="8"  width="7" height="22" rx="2" fill="#F2B630" transform="rotate(-10 20.5 19)"/>
    <rect x="26" y="4"  width="7" height="26" rx="2" fill="#FFD25E"/>
    <rect x="34" y="6"  width="7" height="24" rx="2" fill="#F2B630" transform="rotate(6 37.5 18)"/>
    <rect x="41" y="10" width="7" height="20" rx="2" fill="#FFD25E" transform="rotate(14 44.5 20)"/>
    <path d="M12 24h40l-5 35H17z" fill="#FFF8EE" stroke-width="3.4"/>
    <path d="M13.4 34h37.2l-1.1 8H14.5z" fill="#D42A2A" stroke-width="2.2"/>
  </g>
</svg>
